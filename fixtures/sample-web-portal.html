<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enterprise Web Portal | Testing Environment</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; color: #222; }
    header.portal-nav, header.cmp-navigation { background: #111; color: #fff; padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; }
    .nav-links, .cmp-navigation__group { list-style: none; display: flex; gap: 1.5rem; margin: 0; padding: 0; }
    .nav-item-link, .cmp-navigation__item-link { color: #fff; text-decoration: none; font-weight: 500; font-size: 1rem; }
    .nav-item-link:hover, .cmp-navigation__item-link:hover { color: #38bdf8; }
    .hero-banner, .cmp-teaser { position: relative; background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white; padding: 5rem 2rem; text-align: center; }
    .hero-title, .cmp-teaser__title { font-size: 2.5rem; margin-bottom: 1.5rem; }
    .cta-button, .cmp-teaser__action-link, .cmp-button { display: inline-block; background-color: #f39c12; color: #fff; padding: 0.8rem 2rem; border-radius: 4px; text-decoration: none; font-weight: bold; border: none; cursor: pointer; }
    .search-section, .cmp-search { padding: 1.5rem 2rem; text-align: center; }
    .search-input, .cmp-search__input { padding: 0.6rem 1rem; width: 320px; border-radius: 4px; border: 1px solid #ccc; }
    .heading-section, .cmp-title { padding: 2rem; text-align: center; }
    .heading-text, .cmp-title__text { font-size: 2rem; color: #333; }
  </style>
</head>
<body>
  <header class="portal-nav cmp-navigation" role="navigation">
    <div class="brand"><strong>PORTAL</strong></div>
    <ul class="nav-links cmp-navigation__group">
      <li><a class="nav-item-link cmp-navigation__item-link" href="#home">Home</a></li>
      <li><a class="nav-item-link cmp-navigation__item-link" href="#adventures">Adventures</a></li>
      <li><a class="nav-item-link cmp-navigation__item-link" href="#services">Services</a></li>
    </ul>
  </header>

  <main>
    <section class="hero-banner cmp-teaser cmp-hero">
      <div class="hero-content cmp-teaser__content">
        <h2 class="hero-title cmp-teaser__title">Next-Gen Enterprise Platform</h2>
        <div class="cta-container cmp-teaser__action-container">
          <a class="cta-button cmp-teaser__action-link cmp-button" role="link" href="#explore">Explore Adventures</a>
        </div>
      </div>
    </section>

    <section class="search-section cmp-search">
      <input class="search-input cmp-search__input" type="search" placeholder="Search portal..." />
    </section>

    <section class="heading-section cmp-title">
      <h1 class="heading-text cmp-title__text">Adventures</h1>
    </section>
  </main>
</body>
</html>
